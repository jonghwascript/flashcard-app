<section class="c-panel c-stats l-stats" aria-labelledby="stats-title">
  <h3 id="stats-title" class="c-stats__title">Study Statistics</h3>
  <dl class="c-stats__list l-stats__list">
    <div class="c-stats__item c-stats__item--total">
      <div class="c-stats__text">
        <dt class="c-stats__label">Total Cards</dt>
        <dd class="c-stats__value" data-js="stat-total">40</dd>
      </div>
      <div class="c-stats__icon">
        <img
          src="./images/icon-stats-total.svg"
          alt=""
          width="24"
          height="24"
        />
      </div>
    </div>
    <div class="c-stats__item c-stats__item--mastered">
      <div class="c-stats__text">
        <dt class="c-stats__label">Mastered</dt>
        <dd class="c-stats__value" data-js="stat-mastered">11</dd>
      </div>
      <div class="c-stats__icon">
        <img
          src="./images/icon-stats-mastered.svg"
          alt=""
          width="26"
          height="24"
        />
      </div>
    </div>
    <div class="c-stats__item c-stats__item--in-progress">
      <div class="c-stats__text">
        <dt class="c-stats__label">In Progress</dt>
        <dd class="c-stats__value" data-js="stat-in-progress">21</dd>
      </div>
      <div class="c-stats__icon">
        <img
          src="./images/icon-stats-in-progress.svg"
          alt=""
          width="30"
          height="24"
        />
      </div>
    </div>
    <div class="c-stats__item c-stats__item--not-started">
      <div class="c-stats__text">
        <dt class="c-stats__label">Not Started</dt>
        <dd class="c-stats__value" data-js="stat-not-started">8</dd>
      </div>
      <div class="c-stats__icon">
        <img
          src="./images/icon-stats-not-started.svg"
          alt=""
          width="27"
          height="18"
        />
      </div>
    </div>
  </dl>
</section>
